<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clip editor · Clippfy</title><link rel="stylesheet" href="/assets/workspace.css"></head><body><main><header><h1>Clip editor</h1><a href="/app#projects">Back to projects</a></header><p id="status" role="status">Loading your clip…</p><div class="grid" id="editor" hidden><section class="panel"><video id="video" controls playsinline></video><a id="download" class="button">Download MP4</a></section><form id="editForm" class="panel"><h2>Trim & caption</h2><p class="muted">Changes replace this clip. Existing burned-in captions remain. Download a backup first.</p><label for="start">Start (seconds)</label><input id="start" type="number" min="0" step="0.1" value="0" required><label for="end">End (seconds)</label><input id="end" type="number" min="0.5" step="0.1" required><label for="text">Optional text overlay</label><textarea id="text" rows="3" maxlength="500" placeholder="Add your own caption"></textarea><label for="style">Caption color</label><select id="style"><option value="lime">Lime</option><option value="yellow">Yellow</option><option value="fire">Fire</option><option value="classic">White</option></select><button id="save">Save & render</button><p class="muted">Exports are vertical 720p MP4, with audio where present. Rendering can take a minute.</p></form></div></main><script src="/assets/editor.js" defer></script></body></html>
