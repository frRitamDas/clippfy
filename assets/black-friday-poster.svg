<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Clippfy Black Friday launch preview</title><desc id="desc">Less editing. More creating. Planned Starter launch price nine dollars per month. Paid checkout coming soon. Free workspace available now.</desc><defs><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern><radialGradient id="glow"><stop stop-color="#d1fe17" stop-opacity=".23"/><stop offset="1" stop-color="#d1fe17" stop-opacity="0"/></radialGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#45454b"/><stop offset=".48" stop-color="#d7d7dc"/><stop offset=".55" stop-color="#5c5c63"/><stop offset="1" stop-color="#222226"/></linearGradient></defs><rect width="1200" height="1500" fill="#0c0c0d"/><rect width="1200" height="1500" fill="url(#grid)"/><ellipse cx="1050" cy="820" rx="600" ry="650" fill="url(#glow)"/><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(76 70)"><rect width="48" height="48" rx="12" fill="#d1fe17"/><path d="M12 15h25M12 25h25M12 35h16" stroke="#0c0c0d" stroke-width="5"/><text x="64" y="37" font-size="42" font-weight="700" fill="#f1f2ec" letter-spacing="-2">Clippfy</text></g><rect x="825" y="78" width="299" height="40" rx="20" fill="#222226" stroke="#39393e"/><text x="974" y="104" text-anchor="middle" font-size="16" letter-spacing="2" fill="#d1fe17">LAUNCH PREVIEW / 2026</text><text x="70" y="319" font-size="170" font-weight="900" letter-spacing="-12" fill="#f1f2ec">BLACK</text><text x="70" y="487" font-size="170" font-weight="900" letter-spacing="-12" fill="#d1fe17">FRIDAY.</text><text x="78" y="555" font-size="23" letter-spacing="5" fill="#acada7">LESS EDITING. MORE CREATING.</text><g transform="translate(823 683) rotate(14)"><rect x="-170" y="-28" width="286" height="390" rx="42" fill="#111113" stroke="url(#metal)" stroke-width="6"/><rect x="-150" y="-8" width="246" height="350" rx="28" fill="#222226"/><path d="M-56 89 34 145-56 201z" fill="#d1fe17"/><rect x="-121" y="260" width="188" height="9" rx="4" fill="#d1fe17"/><rect x="-121" y="282" width="133" height="9" rx="4" fill="#78797b"/></g><g transform="translate(1020 627)"><path d="M0-74V74M-74 0H74M-52-52 52 52M-52 52 52-52" stroke="#d1fe17" stroke-width="13"/></g><text x="80" y="696" font-size="19" letter-spacing="4" fill="#d1fe17">THE STARTER PLAN</text><text x="72" y="894" font-size="210" font-weight="800" letter-spacing="-12" fill="#f1f2ec">$9</text><text x="354" y="890" font-size="29" fill="#acada7">/ month</text><text x="80" y="950" font-size="18" font-weight="700" letter-spacing="1.2" fill="#d1fe17">PLANNED LAUNCH PRICE</text><text x="80" y="985" font-size="21" fill="#acada7">Paid checkout coming soon.</text><path d="M80 1050H1120" stroke="#39393e"/><text x="80" y="1110" font-size="25" fill="#f1f2ec">Upload. Clip. Make it yours.</text><text x="80" y="1150" font-size="21" fill="#acada7">Start with the free workspace while we build.</text><rect x="80" y="1210" width="1040" height="100" rx="22" fill="#d1fe17"/><text x="124" y="1273" font-size="31" font-weight="800" letter-spacing="1" fill="#0c0c0d">TRY THE FREE WORKSPACE</text><path d="M1010 1260h60m-20-20 20 20-20 20" stroke="#0c0c0d" fill="none" stroke-width="5"/><text x="80" y="1375" font-size="24" fill="#f1f2ec">clippfyediting.vercel.app</text><text x="80" y="1425" font-size="16" fill="#888a83">No payment required for free access. Processing and storage limits apply.</text></g></svg>
